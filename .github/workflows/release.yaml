name: Re-publish Release (manual fallback)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to re-publish (e.g. 0.0.47)"
        required: true
        type: string

jobs:
  republish:
    name: Re-publish release ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Obtain token
        uses: octo-sts/action@v1.0.0
        id: sts-paas-cli
        with:
          scope: shopware/paas-cli
          identity: sw-paas

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ steps.sts-paas-cli.outputs.token }}
        run: |
          mkdir -p artifacts
          gh release download "${{ inputs.version }}" \
            --dir artifacts \
            --repo shopware/paas-cli

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: "Release ${{ inputs.version }}"
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
